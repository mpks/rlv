                   name="show-group"
                   value="unindexed">
            <span>Unindexed</span>
          </label>
          <label class="radio-btn">
            <input type="radio"
                   name="show-group"
                   value="integrated">
            <span>Integrated</span>
          </label>
        </div>
      </div>

      <div class="row res-row">
        <label>Resolution (Å)</label>
        <div class="res-filter-right">
          <div id="res-range"></div>
          <div class="res-num-row">
            <input type="number" id="res-num-lo"
                   step="0.1">
            <span class="range-sep">–</span>
            <input type="number" id="res-num-hi"
                   step="0.1">
          </div>
        </div>
      </div>

      <div class="row res-row">
        <label>Image index</label>
        <div class="res-filter-right">
          <div id="z-range"></div>
          <div class="res-num-row">
            <input type="number" id="z-num-lo"
                   step="1">
            <span class="range-sep">–</span>
            <input type="number" id="z-num-hi"
                   step="1">
          </div>
        </div>
      </div>

      <div class="row res-row">
        <label>Spot pixels (N)</label>
        <div class="res-filter-right">
          <div id="px-range"></div>
          <div class="res-num-row">
            <input type="number" id="px-num-lo"
                   step="1">
            <span class="range-sep">–</span>
            <input type="number" id="px-num-hi"
                   step="1">
          </div>
        </div>
      </div>

      <div class="row res-row">
        <label>H index</label>
        <div class="res-filter-right">
          <div id="h-range"></div>
          <div class="res-num-row">
            <input type="number" id="h-num-lo"
                   step="1">
            <span class="range-sep">–</span>
            <input type="number" id="h-num-hi"
                   step="1">
          </div>
        </div>
      </div>

      <div class="row res-row">
        <label>K index</label>
        <div class="res-filter-right">
          <div id="k-range"></div>
          <div class="res-num-row">
            <input type="number" id="k-num-lo"
                   step="1">
            <span class="range-sep">–</span>
            <input type="number" id="k-num-hi"
                   step="1">
          </div>
        </div>
      </div>

      <div class="row res-row">
        <label>L index</label>
        <div class="res-filter-right">
          <div id="l-range"></div>
          <div class="res-num-row">
            <input type="number" id="l-num-lo"
                   step="1">
            <span class="range-sep">–</span>
            <input type="number" id="l-num-hi"
                   step="1">
          </div>
        </div>
      </div>

    </div><!-- /section-filter -->

    <!-- Overlays -->
    <div class="section-label"
         data-section="overlays">
      Overlays
      <span class="section-toggle">▼</span>
    </div>
    <div class="section-content"
         id="section-overlays">

      <div class="row">
        <label>Rotation axis</label>
        <div class="toggle on"
             id="tog-axis"></div>
      </div>
      <div class="row">
        <label>Reciprocal cell</label>
        <div class="toggle on"
             id="tog-cell"></div>
      </div>
      <div class="row">
        <label>Beam vector</label>
        <div class="toggle on"
             id="tog-beam"></div>
      </div>
      <div class="row">
        <label>Experiment info</label>
        <div class="toggle on"
             id="tog-exp-info"></div>
      </div>

    </div><!-- /section-overlays -->

    <!-- Annotations -->
    <div class="section-label"
         data-section="annotations">
      Annotations
      <span class="section-toggle">▼</span>
    </div>
    <div class="section-content"
         id="section-annotations">

      <div class="row">
        <label>Miller indices</label>
        <div class="toggle"
             id="tog-ann-hkl"></div>
      </div>
      <div class="row">
        <label>Resolution (Å)</label>
        <div class="toggle"
             id="tog-ann-res"></div>
      </div>
      <div class="row">
        <label>Intensity</label>
        <div class="toggle"
             id="tog-ann-int"></div>
      </div>
      <div class="row">
        <label>Label size</label>
        <input type="range" id="ann-size"
               min="9" max="20"
               step="1" value="13">
        <input type="number"
               id="ann-size-num"
               min="9" max="20"
               step="1" value="13">
      </div>

    </div><!-- /section-annotations -->

    <!-- View -->
    <div class="section-label"
         data-section="display">
      View
      <span class="section-toggle">▼</span>
    </div>
    <div class="section-content"
         id="section-display">

      <div class="row">
        <label>Show in crystal frame</label>
        <div class="toggle"
             id="tog-crystal-frame"></div>
      </div>

      <div class="row">
        <label>Show tooltips</label>
        <div class="toggle on"
             id="tog-tooltips"></div>
      </div>

      <div class="row">
        <label>Spot size</label>
        <input type="range"
               id="filt-point-size"
               min="1" max="20"
               step="0.5" value="5">
        <input type="number"
               id="point-size-num"
               min="1" max="20"
               step="0.5" value="5">
      </div>

    </div><!-- /section-view -->

    <!-- Tools -->
    <div class="section-label"
         data-section="tools">
      Tools
      <span class="section-toggle">▼</span>
    </div>
    <div class="section-content"
         id="section-tools">

      <div class="row">
        <label>Invert rotation axis</label>
        <div class="toggle"
             id="tog-inv-rot-axis"></div>
      </div>
      <div class="row">
        <label>Inspection sphere</label>
        <div class="toggle"
             id="tog-inspect-sphere"></div>
      </div>
      <div class="row">
        <label>Resolution (Å)</label>
        <input type="range"
               id="inspect-d-slider"
               min="0.001" max="1"
               step="0.001" value="0.001">
        <input type="number"
               id="inspect-d-num"
               min="1" max="999"
               step="any" value="999">
      </div>

    </div><!-- /section-tools -->

  </div><!-- /sidebar-body -->
</div><!-- /sidebar -->

<!-- ── Canvas ──────────────────────── -->
<div id="canvas-wrap">
  <div id="loading">3D view</div>
  <div id="inspection-label"></div>
  <div id="tooltip">
    <div class="hkl" id="tt-hkl"></div>
    <table id="tt-table"></table>
  </div>
</div>

<!-- ── Toolbar ─────────────────────── -->
<div id="toolbar">
  <div id="toolbar-spacer"></div>
  <span class="tbtn-label">Align:</span>
  <button class="tbtn" id="btn-align-rot">rot</button>
  <button class="tbtn" id="btn-align-beam">beam</button>
  <button class="tbtn" id="btn-align-astar">a*</button>
  <button class="tbtn" id="btn-align-bstar">b*</button>
  <button class="tbtn" id="btn-align-cstar">c*</button>
  <div style="flex:1"></div>
  <button class="tbtn" id="btn-spin">Spin</button>
  <button class="tbtn" id="btn-fullscreen"
          title="Toggle fullscreen">
    <svg id="fs-icon-expand"
         width="13" height="13"
         viewBox="0 0 14 14"
         fill="none" stroke="currentColor"
         stroke-width="1.8"
         stroke-linecap="round">
      <polyline points="4,1 1,1 1,4"/>
      <polyline points="10,1 13,1 13,4"/>
      <polyline points="4,13 1,13 1,10"/>
      <polyline points="10,13 13,13 13,10"/>
    </svg>
    <svg id="fs-icon-compress"
         width="13" height="13"
         viewBox="0 0 14 14"
         fill="none" stroke="currentColor"
         stroke-width="1.8"
         stroke-linecap="round"
         style="display:none">
      <polyline points="1,4 4,4 4,1"/>
      <polyline points="13,4 10,4 10,1"/>
      <polyline points="1,10 4,10 4,13"/>
      <polyline points="13,10 10,10 10,13"/>
    </svg>
  </button>
  <div style="flex:1"></div>
  <button class="tbtn"
          id="btn-open-dials">Open</button>
</div>

<!-- ── Statusbar ───────────────────── -->
<div id="statusbar">
  <span>
    <span class="sdot"></span>
    <span id="status-msg">Ready</span>
  </span>
  <span id="status-count"></span>
  <span>
    Drag to rotate · Scroll to zoom ·
    Middle-drag to pan
  </span>
</div>

<!-- ── Collapse button ─────────────── -->
<button id="btn-collapse"
        title="Toggle sidebar">‹</button>

<!-- ── Open dialog ─────────────────── -->
<div id="dlg-open"
     style="display:none;
            position:fixed;inset:0;
            background:rgba(0,0,0,.7);
            align-items:center;
            justify-content:center;
            z-index:9999">
  <div style="background:#111118;
              border:1px solid #2a2a3a;
              border-radius:10px;
              padding:24px;width:420px">

    <div style="font-size:15px;
                font-weight:600;
                color:#eee;
                margin-bottom:16px">
      Open DIALS files
    </div>

    <div style="margin-bottom:10px">
      <div style="font-size:11px;
                  color:#aaa;
                  margin-bottom:4px">
        Experiment file (.expt)
      </div>
      <div style="display:flex;gap:6px">
        <input id="dlg-expt-name"
               type="text" readonly
               placeholder="no file selected"
               style="flex:1;
                      background:#0d0d14;
                      border:1px solid #333;
                      border-radius:4px;
                      color:#666;
                      font-size:11px;
                      padding:4px 8px">
        <label style="padding:4px 10px;
                      background:#152a42;
                      border:1px solid #185FA5;
                      border-radius:4px;
                      color:#7ab8f5;
                      font-size:11px;
                      cursor:pointer;
                      white-space:nowrap">
          Browse…
          <input type="file" accept=".expt"
                 style="display:none"
                 id="dlg-expt-input">
        </label>
      </div>
    </div>

    <div style="margin-bottom:20px">
      <div style="font-size:11px;
                  color:#aaa;
                  margin-bottom:4px">
        Reflections file (.refl)
      </div>
      <div style="display:flex;gap:6px">
        <input id="dlg-refl-name"
               type="text" readonly
               placeholder="no file selected"
               style="flex:1;
                      background:#0d0d14;
                      border:1px solid #333;
                      border-radius:4px;
                      color:#666;
                      font-size:11px;
                      padding:4px 8px">
        <label style="padding:4px 10px;
                      background:#152a42;
                      border:1px solid #185FA5;
                      border-radius:4px;
                      color:#7ab8f5;
                      font-size:11px;
                      cursor:pointer;
                      white-space:nowrap">
          Browse…
          <input type="file" accept=".refl"
                 style="display:none"
                 id="dlg-refl-input">
        </label>
      </div>
    </div>

    <div style="margin-bottom:16px;
                font-size:12px;
                color:#aaa">
      <label style="display:flex;
        align-items:center;
        gap:6px;cursor:pointer">
        <input type="checkbox"
          id="dlg-add-mode" checked>
        Add to current data
      </label>
    </div>

    <div style="display:flex;
                justify-content:flex-end;
                gap:8px">
      <button id="dlg-cancel"
              style="padding:6px 16px;
                     background:transparent;
                     border:1px solid #333;
                     border-radius:4px;
                     color:#999;
                     cursor:pointer">
        Cancel
      </button>
      <button id="dlg-load"
              style="padding:6px 16px;
                     background:#152a42;
                     border:1px solid #185FA5;
                     border-radius:4px;
                     color:#7ab8f5;
                     cursor:pointer;
                     font-weight:600">
        Load
      </button>
    </div>

  </div>
</div>

</body>
</html>
