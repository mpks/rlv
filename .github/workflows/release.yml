# Build the RLV desktop app and attach it to a GitHub Release.
#
# Runs when a version tag is pushed:
#     git tag v0.1.0
#     git push origin v0.1.0
#
# Creates a *draft* release for that tag with:
#   - RLV_<version>_amd64.AppImage   (any Linux: chmod +x and run)
#   - RLV_<version>_amd64.deb        (Debian/Ubuntu)
#   - RLV-<version>-1.x86_64.rpm     (Fedora/RHEL)
#   - RLV_<version>_universal.dmg    (macOS, Apple Silicon and Intel)
#   - the same with fixed names (RLV-linux-x86_64.AppImage, RLV-macos-universal.dmg, …)
#   - rlv.html                       (the single-file web viewer)
# Check it on the Releases page, then click "Publish release".
# The README links to .../releases/latest/download/<fixed name>, which
# always points at the newest *published* (not draft) release.
#
# The app version is taken from the tag (v0.1.0 -> 0.1.0).
name: Release desktop app

on:
  push:
    tags: ['v*']

permissions:
  contents: write           # needed to create the release and upload files

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          # Built on the older Ubuntu so the app also runs on older distros.
          - platform: ubuntu-22.04
            args: ''
          # One .dmg that runs on both Apple Silicon and Intel Macs.
          - platform: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history and tags, for the version label (git describe)

      - name: Install Linux build dependencies
        if: startsWith(matrix.platform, 'ubuntu')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev \
            librsvg2-dev patchelf rpm

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          # The universal macOS build needs both Mac CPU types.
          targets: ${{ startsWith(matrix.platform, 'macos') && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target

      - name: Install npm packages
        working-directory: app
        run: npm ci

      - name: Set app version from tag
        working-directory: app
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json
          mv tmp.json src-tauri/tauri.conf.json
          echo "Building version $VERSION"

      # Builds the web page (npm run build), then the app and the installers,
      # and uploads them to a draft release for this tag. Both jobs add
      # their files to the same release.
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Version label in the app; the step above edits a file, so
          # git describe would add "-dirty".
          RLV_VERSION: ${{ github.ref_name }}
        with:
          projectPath: app
          args: ${{ matrix.args }}
          tagName: ${{ github.ref_name }}
          releaseName: RLV ${{ github.ref_name }}
          releaseBody: |
            **Linux:** download the `.AppImage`, then `chmod +x RLV_*.AppImage` and run it,
            or install the `.deb` (Debian/Ubuntu) or `.rpm` (Fedora/RHEL).

            **macOS:** download the `.dmg`, open it and drag RLV to Applications.
            The app is not yet signed by Apple, so the first time macOS will refuse to open it:
            go to System Settings → Privacy & Security and click **Open Anyway**.
            If macOS says the app "is damaged", run
            `xattr -dr com.apple.quarantine /Applications/RLV.app` in Terminal.

            **Web version:** `rlv.html` is the single-file viewer. Open it in a browser,
            or host it on a web server (see the README for `?expt=…&refl=…`).
          releaseDraft: true
          prerelease: false

      # Also attach copies with fixed names (no version number), so the
      # README can link to .../releases/latest/download/<name> and always
      # get the newest published release. rlv.html is the single-file web
      # viewer, for sites that host their own copy.
      - name: Attach fixed-name downloads (Linux)
        if: startsWith(matrix.platform, 'ubuntu')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          B=app/src-tauri/target/release/bundle
          cp $B/appimage/*.AppImage RLV-linux-x86_64.AppImage
          cp $B/deb/*.deb           RLV-linux-amd64.deb
          cp $B/rpm/*.rpm           RLV-linux-x86_64.rpm
          cp app/dist/index.html rlv.html
          gh release upload "$GITHUB_REF_NAME" --clobber \
            RLV-linux-x86_64.AppImage RLV-linux-amd64.deb RLV-linux-x86_64.rpm rlv.html

      - name: Attach fixed-name downloads (macOS)
        if: startsWith(matrix.platform, 'macos')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp app/src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg RLV-macos-universal.dmg
          gh release upload "$GITHUB_REF_NAME" --clobber RLV-macos-universal.dmg
